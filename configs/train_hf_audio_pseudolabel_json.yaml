model:
  name_or_path: facebook/wav2vec2-xls-r-300m

dataset:
  backend: hf
  hf_name: pengyizhou/nsc-imda-part6
  hf_config: null
  splits:
    train: train
    val: validation
    test: test
  columns:
    audio: audio
    transcript: text
    test_audio: audio
    test_transcript: text  # test split has ground-truth text in the HF dataset
    id: id

transcript:
  source: jsonl  # transcripts come from an external JSONL file, not the HF dataset text column
  jsonl:
    type: pseudolabel
    json_path: ../examples/pseudolabels/IMDA_pseudolabels.jsonl
    dev_json_path: null  # null = split dev set from train; set to a separate JSONL for pseudolabel dev
    text_col: text
    # audio_path_col: the pseudolabel JSONL field whose filename stem is used as the utterance ID
    # to match against the HF dataset's hf_id_col.
    audio_path_col: audio_path
    hf_id_col: id   # column in the HF dataset used to match pseudolabel IDs
    # hf_audio_splits: HF splits to draw audio from when joining pseudolabels.
    # Excludes 'test' to prevent test-set leakage into training.
    hf_audio_splits: train,validation
    prevent_test_leakage: true  # raise an error if test split is listed in hf_audio_splits
    score_col: score
    min_score: 0.6  # only use pseudolabels with confidence >= 0.6

normalization:
  normalizer_yaml: null

vocab:
  # shared_hf_plus_pseudolabel: vocab covers both HF ground-truth text and pseudolabel text,
  # so the character set is consistent even when training on pseudolabels only.
  mode: shared_hf_plus_pseudolabel
  out_path: ../artifacts/vocab/vocab_shared.json
  score_col: score
  min_score: 0.0    # no filter on the primary HF source
  aux_score_col: score
  aux_min_score: 0.6

training:
  out_dir: ../runs/xlsr300m_pseudo
  max_sec: 30.0
  num_proc: 8
  seed: 42
  val_size: 0.1
  bs: 16
  grad_accum: 2
  lr: 3.0e-5
  epochs: 20.0
  lr_scheduler: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  eval_steps: 1200
  save_steps: 1200
  logging_steps: 50
  save_total_limit: 4
  best_metric: wer_decoded_norm

eval:
  split: test
  columns:
    audio: audio
    transcript: text
    id: id
